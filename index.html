<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartStock</title>
  <meta name="description" content="SmartStock — offline-first retail inventory management">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#14243A">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">SmartStock</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="nav-collapse" id="collapseBtn" type="button" aria-label="Collapse sidebar">«</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="content-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu">☰</button>
        <button class="search-trigger" id="searchBtn" type="button">
          <span aria-hidden="true">⌕</span>
          <span data-i18n="search_placeholder">Search…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="topbar-right">
          <button class="status-pill save-pill" id="saveState" type="button" hidden aria-live="polite"></button>
          <span class="status-pill" id="netStatus" role="status"></span>
          <button class="icon-btn" id="langBtn" type="button" aria-label="Language">မြန်</button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
          <button class="icon-btn" id="helpBtn" type="button" aria-label="Keyboard shortcuts">?</button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="js/utils.js"></script>
  <script src="js/i18n-my.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audit-log.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/barcode.js"></script>
  <script src="js/products.js"></script>
  <script src="js/stocktake.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/suppliers.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/cash-management.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
